[package]
name = "tezbar-google-search"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0 AND MIT"
description = "Standalone Rust Google Search process extension"
repository = "https://github.com/almatkai/google-search"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "process", "fs", "net"] }
tezbar-extension-sdk = { git = "https://github.com/almatkai/tezbar-extension-sdk-rust.git", rev = "9f91afcc071c3f301414dc62b33cfeac7d89a0cf" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
